[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exactmpc"
version = "0.0.1"
description = "Exact constrained MPC for CNC feed drives with a learned planner above a certified closed-form layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plots = ["matplotlib>=3.7"]
planner = ["torch>=2.1"]
baselines = ["osqp>=0.6", "daqp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
